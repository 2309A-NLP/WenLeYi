services:
  # ========== Flask 应用（主服务） ==========
  rag-app:
    build: .
    container_name: gongdan10-app
    ports:
      - "5000:5000"
    volumes:
      - ./documents:/app/documents
      - ./vector_store:/app/vector_store
      - ./uploads:/app/uploads
      - /mnt/d/桌面/模型/m3e-base:/app/models/m3e-base:ro
      - /mnt/d/桌面/模型/bge-reranker-base:/app/models/bge-reranker-base:ro
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
