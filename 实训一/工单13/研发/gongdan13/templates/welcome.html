<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 智能问答</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;color:#e0e0e0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.bg .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.3;animation:float 8s ease-in-out infinite}
.bg .orb:nth-child(1){width:400px;height:400px;background:#7c3aed;top:-100px;left:-100px;animation-delay:0s}
.bg .orb:nth-child(2){width:300px;height:300px;background:#06b6d4;bottom:-50px;right:-50px;animation-delay:3s}
.bg .orb:nth-child(3){width:200px;height:200px;background:#ec4899;top:50%;left:50%;animation-delay:5s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
.content{position:relative;z-index:1;text-align:center;max-width:600px;padding:40px}
.logo{font-size:64px;margin-bottom:20px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
h1{font-size:36px;font-weight:800;background:linear-gradient(135deg,#7c3aed,#06b6d4,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.subtitle{font-size:16px;color:#888;margin-bottom:40px;line-height:1.6}
.features{display:flex;gap:20px;justify-content:center;margin-bottom:40px;flex-wrap:wrap}
.feature{padding:12px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;font-size:13px;color:#aaa}
.feature span{margin-right:6px}
.start-btn{padding:16px 48px;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7c3aed,#06b6d4);border:none;border-radius:16px;cursor:pointer;transition:all .3s;box-shadow:0 4px 24px rgba(124,58,237,.4)}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,58,237,.6)}
.start-btn:active{transform:translateY(0)}
.footer{position:fixed;bottom:20px;color:#444;font-size:12px;z-index:1}
.lang-btn{position:fixed;top:20px;right:20px;padding:8px 16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#aaa;font-size:13px;cursor:pointer;z-index:10;transition:all .2s}
.lang-btn:hover{background:rgba(255,255,255,.2);color:#fff}
</style>
</head>
<body>
<div class="bg">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<button class="lang-btn" id="langBtn">English</button>

<div class="content">
  <div class="logo">&#x1F4DA;</div>
  <h1 id="title">RAG 智能问答系统</h1>
  <p class="subtitle" id="subtitle">基于检索增强生成技术，让 AI 帮你从文档中快速找到答案</p>
  <div class="features">
    <div class="feature"><span>&#x1F50D;</span><span id="f1">智能检索</span></div>
    <div class="feature"><span>&#x1F4C4;</span><span id="f2">多文档支持</span></div>
    <div class="feature"><span>&#x1F3A4;</span><span id="f3">语音输入</span></div>
    <div class="feature"><span>&#x1F5BC;&#xFE0F;</span><span id="f4">图片识别</span></div>
  </div>
  <button class="start-btn" id="startBtn">开始使用 &#x2192;</button>
</div>
<div class="footer">Powered by RAG Scaffold Skill</div>

<script>
var i18n={
  zh:{title:'RAG 智能问答系统',subtitle:'基于检索增强生成技术，让 AI 帮你从文档中快速找到答案',f1:'智能检索',f2:'多文档支持',f3:'语音输入',f4:'图片识别',start:'开始使用 →',langBtn:'中文'},
  en:{title:'RAG Q&A System',subtitle:'Powered by RAG technology, let AI find answers from your documents',f1:'Smart Search',f2:'Multi-Document',f3:'Voice Input',f4:'Image Recognition',start:'Get Started →',langBtn:'English'}
};
var lang=localStorage.getItem('rag_lang')||'zh';

function applyLang(){
  var t=i18n[lang];
  document.getElementById('title').textContent=t.title;
  document.getElementById('subtitle').textContent=t.subtitle;
  document.getElementById('f1').textContent=t.f1;
  document.getElementById('f2').textContent=t.f2;
  document.getElementById('f3').textContent=t.f3;
  document.getElementById('f4').textContent=t.f4;
  document.getElementById('startBtn').textContent=t.start;
  document.getElementById('langBtn').textContent=t.langBtn;
}

document.getElementById('langBtn').onclick=function(){
  lang=(lang==='zh')?'en':'zh';
  localStorage.setItem('rag_lang',lang);
  applyLang();
};

document.getElementById('startBtn').onclick=function(){
  window.location.href='/chat';
};

applyLang();
</script>
</body>
</html>
