<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小家记账本</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            background: #FDF8F3;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            color: #4A4A4A;
        }

        /* 导航栏 */
        .navbar {
            background: linear-gradient(135deg, #FFE5E5 0%, #FFD1DC 100%);
            padding: 14px 24px; display: flex; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 2px 12px rgba(255,180,190,0.25);
        }
        .navbar .back-btn {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px; border-radius: 10px; border: none;
            background: rgba(255,255,255,0.6); font-size: 18px; cursor: pointer;
            transition: all 0.2s;
        }
        .navbar .back-btn:hover { background: rgba(255,255,255,0.9); transform: translateY(-50%) scale(1.08); }
        .navbar .title { font-size: 20px; font-weight: 700; color: #D4637A; letter-spacing: 1px; }

        /* 主布局：左卡片 + 右聊天 */
        .main { flex: 1; display: flex; overflow: hidden; padding: 16px; gap: 16px; }

        /* 左侧卡片区 */
        .side-panel { width: 300px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }

        .card {
            background: #FFFBF7; border-radius: 18px; padding: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #F5EDE5; transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.07); }
        .card-title {
            font-size: 13px; font-weight: 600; color: #B08968;
            margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
        }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stat-item { text-align: center; flex: 1; }
        .stat-label { font-size: 11px; color: #A09080; margin-bottom: 4px; }
        .stat-value { font-size: 20px; font-weight: 700; }
        .stat-value.expense { color: #FF8C69; }
        .stat-value.income { color: #3DAA6D; }
        .stat-value.count { color: #7EB8D8; }

        /* 环形进度条 */
        .ring-list { display: flex; flex-direction: column; gap: 10px; }
        .ring-item { display: flex; align-items: center; gap: 12px; }
        .ring-svg { width: 44px; height: 44px; transform: rotate(-90deg); }
        .ring-bg { fill: none; stroke: #F0E8E0; stroke-width: 5; }
        .ring-fg { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
        .ring-info { flex: 1; }
        .ring-name { font-size: 13px; font-weight: 500; color: #5A5A5A; }
        .ring-detail { font-size: 11px; color: #A09080; margin-top: 2px; }

        /* 快捷按钮 */
        .quick-btns { display: flex; gap: 8px; }
        .quick-btn {
            flex: 1; padding: 10px 0; border: none; border-radius: 12px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .quick-btn:hover { transform: scale(1.04); }
        .quick-btn.primary { background: linear-gradient(135deg, #A8D8EA, #8EC5D6); color: #3A7A8A; }
        .quick-btn.secondary { background: linear-gradient(135deg, #F9D5A7, #F4C084); color: #8A6A3A; }

        /* 右侧聊天区 */
        .chat-panel {
            flex: 1; display: flex; flex-direction: column;
            background: #FFFFFF; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: #E8DDD5; border-radius: 3px; }

        .msg { margin-bottom: 14px; display: flex; animation: fadeUp 0.35s ease; }
        .msg.user { justify-content: flex-end; }
        .msg.bot { justify-content: flex-start; }
        .bubble {
            max-width: 72%; padding: 12px 18px; font-size: 14px; line-height: 1.7;
            white-space: pre-wrap; word-break: break-all;
        }
        .msg.bot .bubble {
            background: #F8F4F0; color: #4A4A4A;
            border-radius: 4px 16px 16px 16px;
            border: 1px solid #F0E8E0;
        }
        .msg.user .bubble {
            background: #E5F1FF; color: #333;
            border-radius: 16px 4px 16px 16px;
            border: 1px solid #C8E2FF;
        }
        .bubble .amount { color: #FF8C69; font-weight: 600; }
        .bubble .tag {
            display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 8px;
            margin-right: 4px; font-weight: 500;
        }
        .tag.expense { background: #FFF0EB; color: #E8734A; }
        .tag.income { background: #E8F8EE; color: #3DAA6D; }

        /* 输入区 */
        .input-bar {
            display: flex; padding: 12px 16px; gap: 10px;
            border-top: 1px solid #F0E8E0; background: #FFFBF8;
        }
        .input-wrap {
            flex: 1; display: flex; align-items: center; gap: 8px;
            background: #F5F0EB; border-radius: 24px; padding: 0 16px;
            border: 1.5px solid #E8DDD5; transition: border-color 0.2s;
        }
        .input-wrap:focus-within { border-color: #F4A9B8; background: #FFF; }
        .input-wrap .icon { font-size: 16px; opacity: 0.5; }
        .input-wrap input {
            flex: 1; border: none; background: transparent; padding: 10px 0;
            font-size: 14px; outline: none; color: #4A4A4A;
        }
        .send-btn {
            padding: 10px 22px; border: none; border-radius: 24px; cursor: pointer;
            background: linear-gradient(135deg, #F7A58E, #F4845F);
            color: white; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.2s; box-shadow: 0 3px 12px rgba(244,132,95,0.3);
        }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 5px 18px rgba(244,132,95,0.4); }

        /* 星星动画 */
        .star {
            position: fixed; pointer-events: none; z-index: 999;
            font-size: 16px; animation: starFall 1.2s ease-out forwards;
        }
        @keyframes starFall {
            0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translateY(120px) rotate(360deg) scale(0.3); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 弹窗 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: #FFFBF7; width: 80%; max-width: 650px; max-height: 80vh;
            overflow-y: auto; border-radius: 18px; padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-box h3 { margin-bottom: 14px; color: #D4637A; font-size: 16px; }
        .modal-box pre {
            background: #F8F4F0; padding: 14px; border-radius: 10px;
            font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap;
            border: 1px solid #F0E8E0;
        }
        .modal-close {
            float: right; background: #F4A9B8; color: white; border: none;
            padding: 5px 16px; border-radius: 10px; cursor: pointer; font-size: 13px;
            transition: background 0.2s;
        }
        .modal-close:hover { background: #E8899A; }

        .debug-bar {
            display: flex; gap: 8px; padding: 6px 16px; background: #FFFBF8;
            border-top: 1px solid #F0E8E0;
        }
        .debug-btn {
            padding: 5px 14px; border: none; border-radius: 10px; cursor: pointer;
            font-size: 11px; font-weight: 500; transition: all 0.2s;
        }
        .debug-btn:hover { transform: scale(1.05); }
        .debug-btn.green { background: #D5F0E0; color: #3D8A5A; }
        .debug-btn.orange { background: #FFE8D0; color: #B07030; }

        .empty-hint { text-align: center; color: #C0B0A0; font-size: 13px; padding: 20px 0; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <button class="back-btn" onclick="history.back()">←</button>
        <span class="title">🏠 小家记账本</span>
    </div>

    <div class="main">
        <!-- 左侧卡片区 -->
        <div class="side-panel">
            <!-- 今日汇总 -->
            <div class="card">
                <div class="card-title" style="justify-content:space-between;">
                    <span>📅 日期概览</span>
                    <input type="date" id="datePicker" style="font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid #E8DDD5;background:#FFF;color:#5A5A5A;cursor:pointer;" onchange="changeDate(this.value)">
                </div>
                <div class="stat-row">
                    <div class="stat-item">
                        <div class="stat-label">支出</div>
                        <div class="stat-value expense" id="todayExpense">0元</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">收入</div>
                        <div class="stat-value income" id="todayIncome">0元</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">笔数</div>
                        <div class="stat-value count" id="todayCount">0笔</div>
                    </div>
                </div>
            </div>

            <!-- 月度分类占比 -->
            <div class="card" style="flex:1;">
                <div class="card-title">📊 本月支出分类</div>
                <div class="ring-list" id="ringList">
                    <div class="empty-hint">暂无数据</div>
                </div>
            </div>

            <!-- 快捷按钮 -->
            <div class="quick-btns">
                <button class="quick-btn primary" onclick="quickToday()">📊 汇总今日</button>
                <button class="quick-btn secondary" onclick="quickMonthly()">📈 月度报表</button>
            </div>
        </div>

        <!-- 右侧聊天区 -->
        <div class="chat-panel">
            <div class="chat-box" id="chatBox"></div>
            <div class="debug-bar">
                <button class="debug-btn green" onclick="viewCalls()">📋 调用信息</button>
                <button class="debug-btn orange" onclick="viewData()">📊 已存数据</button>
                <button class="debug-btn" style="background:#FFE0E0;color:#C05050;" onclick="clearChats()">🗑️ 清空记录</button>
            </div>
            <div class="input-bar">
                <div class="input-wrap">
                    <span class="icon">✏️</span>
                    <input type="text" id="userInput" placeholder="输入账目信息..." onkeydown="if(event.key==='Enter')sendMessage()">
                </div>
                <button class="send-btn" onclick="sendMessage()">📨 发送</button>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="callModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('callModal')">关闭</button>
            <h3>📋 调用信息</h3>
            <pre id="callContent">暂无调用记录</pre>
        </div>
    </div>
    <div class="modal" id="dataModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('dataModal')">关闭</button>
            <h3>📊 已存数据表</h3>
            <pre id="dataContent">加载中...</pre>
        </div>
    </div>

<script>
// ===== 分类图标 =====
const CAT_ICONS = {
    '买书':'📚','图书':'📚','书':'📚',
    '鞋':'👟','鞋类':'👟',
    '护肤':'💄','化妆品':'💄','美妆':'💄',
    '餐饮':'🍜','吃饭':'🍜','食品':'🍜','零食':'🍪',
    '交通':'🚗','出行':'🚗',
    '报销':'💰','工资':'💰','收入':'💰',
    '旅游':'✈️','旅行':'✈️',
    '衣服':'👗','服装':'👗',
    '医疗':'💊','药':'💊',
    '其他':'📦'
};
const RING_COLORS = ['#F4845F','#7EB8D8','#A8D8EA','#F9D5A7','#B5D8A0','#D4A9E8','#F4A9B8'];
function getCatIcon(cat) { return CAT_ICONS[cat] || '📦'; }

// ===== 星星动画 =====
function spawnStars() {
    const emojis = ['⭐','✨','🌟','💫'];
    for (let i = 0; i < 5; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = (30 + Math.random() * 40) + 'vw';
        s.style.top = (30 + Math.random() * 30) + 'vh';
        s.style.animationDelay = (i * 0.12) + 's';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1500);
    }
}

// ===== 消息渲染 =====
function addMsg(role, text) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    let html = text.replace(/\n/g, '<br>');
    html = html.replace(/(\d+\.?\d*)元/g, '<span class="amount">$1元</span>');

    // 只在bot的记账回复中显示收支标签（含"已记录"才算）
    if (role === 'bot' && (text.includes('已记录') || text.includes('已删除') || text.includes('已修改'))) {
        if (text.includes('收入')) {
            html = '<span class="tag income">收入</span>' + html;
        } else {
            html = '<span class="tag expense">支出</span>' + html;
        }
    }

    div.innerHTML = '<div class="bubble">' + html + '</div>';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// ===== 发送消息（普通聊天） =====
function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    saveChat('user', text);
    input.value = '';
    fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({message: text})
    })
    .then(r => r.json())
    .then(data => {
        addMsg('bot', data.reply);
        saveChat('bot', data.reply);
        spawnStars();
        refreshSummary();
        setTimeout(refreshSummary, 1000);
    })
    .catch(() => addMsg('bot', '网络错误，请重试~'));
}

// ===== 保存聊天记录到数据库 =====
function saveChat(role, content) {
    fetch('/api/chats', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({role: role, content: content})
    }).catch(() => {});
}

// ===== 加载历史记录 =====
function loadChats() {
    fetch('/api/chats')
    .then(r => r.json())
    .then(chats => {
        if (chats && chats.length > 0) {
            chats.forEach(c => addMsg(c.role, c.content));
        } else {
            const welcome = {{ welcome | tojson }};
            addMsg('bot', welcome);
        }
    })
    .catch(() => {
        const welcome = {{ welcome | tojson }};
        addMsg('bot', welcome);
    });
}

// ===== 清空聊天记录 =====
function clearChats() {
    if (!confirm('确定要清空所有聊天记录吗？')) return;
    fetch('/api/chats/clear', {method:'POST'})
    .then(() => {
        document.getElementById('chatBox').innerHTML = '';
        const welcome = {{ welcome | tojson }};
        addMsg('bot', welcome);
    });
}

// ===== 直接调API汇总今日（显示当天每条记录） =====
function quickToday() {
    const dateVal = document.getElementById('datePicker').value;
    const today = dateVal || new Date().toISOString().slice(0,10);
    fetch('/api/date_records?date=' + today)
    .then(r => r.json())
    .then(records => {
        addMsg('user', today + ' 账单明细');
        if (records.length === 0) {
            addMsg('bot', today + ' 没有账单记录');
            return;
        }
        let lines = ['📅 ' + today + ' 账单明细：'];
        let total = 0;
        records.forEach((r, i) => {
            const icon = getCatIcon(r.category);
            const sign = r.type === '收入' ? '+' : '-';
            total += r.type === '收入' ? parseFloat(r.amount) : -parseFloat(r.amount);
            lines.push((i+1) + '. ' + icon + ' ' + r.member + ' ' + (r.description||r.category) + ' ' + sign + r.amount + '元');
        });
        lines.push('合计：' + total + '元');
        addMsg('bot', lines.join('\n'));
    });
}

// ===== 直接调API汇总月度（不经过LLM） =====
function quickMonthly() {
    fetch('/api/monthly_category')
    .then(r => r.json())
    .then(d => {
        let lines = ['📈 ' + d.month + ' 月度支出报表：'];
        lines.push('总支出：' + d.total + '元，共 ' + d.count + ' 笔');
        if (d.categories.length > 0) {
            lines.push('分类明细：');
            d.categories.forEach((c, i) => {
                lines.push('  ' + (i+1) + '. ' + getCatIcon(c.name) + ' ' + c.name + '：' + c.amount + '元（' + c.percent + '%）');
            });
        } else {
            lines.push('本月暂无支出记录');
        }
        addMsg('user', '查看月度报表');
        addMsg('bot', lines.join('\n'));
    });
}

// ===== 刷新右侧卡片 =====
function refreshSummary() {
    const dateVal = document.getElementById('datePicker').value;
    const todayParam = dateVal ? '?date=' + dateVal : '';

    // 日期汇总
    fetch('/api/today_summary' + todayParam)
    .then(r => r.json())
    .then(d => {
        document.getElementById('todayExpense').textContent = d.expense + '元';
        document.getElementById('todayIncome').textContent = d.income + '元';
        document.getElementById('todayCount').textContent = d.count + '笔';
    })
    .catch(e => console.error('today_summary失败:', e));

    // 月度分类
    fetch('/api/monthly_category')
    .then(r => r.json())
    .then(d => {
        const list = document.getElementById('ringList');
        if (!d.categories || d.categories.length === 0) {
            list.innerHTML = '<div class="empty-hint">暂无数据</div>';
            return;
        }
        const circumference = 2 * Math.PI * 16;
        list.innerHTML = d.categories.map((c, i) => {
            const color = RING_COLORS[i % RING_COLORS.length];
            const offset = circumference - (c.percent / 100) * circumference;
            return '<div class="ring-item">' +
                '<svg class="ring-svg" viewBox="0 0 44 44">' +
                '<circle class="ring-bg" cx="22" cy="22" r="16"/>' +
                '<circle class="ring-fg" cx="22" cy="22" r="16" stroke="' + color + '" ' +
                'stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"/>' +
                '</svg>' +
                '<div class="ring-info">' +
                '<div class="ring-name">' + getCatIcon(c.name) + ' ' + c.name + '</div>' +
                '<div class="ring-detail">' + c.amount + '元 · ' + c.percent + '%</div>' +
                '</div></div>';
        }).join('');
    })
    .catch(e => console.error('monthly_category失败:', e));
}

// ===== 日期切换 =====
function changeDate(val) {
    refreshSummary();
}

// ===== 调试弹窗 =====
function viewCalls() {
    fetch('/view_calls').then(r => r.json()).then(d => {
        document.getElementById('callContent').textContent = JSON.stringify(d, null, 2);
        document.getElementById('callModal').classList.add('show');
    });
}
function viewData() {
    fetch('/view_data').then(r => r.json()).then(d => {
        document.getElementById('dataContent').textContent = JSON.stringify(d, null, 2);
        document.getElementById('dataModal').classList.add('show');
    });
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});

// ===== 初始化：加载历史记录 =====
loadChats();
refreshSummary();
</script>
</body>
</html>
