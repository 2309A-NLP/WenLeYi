<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 智能助手</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* ==================== CSS 变量 ==================== */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-user-bubble: #3b82f6;
            --bg-bot-bubble: #1e293b;
            --bg-input: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-purple: #a855f7;
            --accent-cyan: #06b6d4;
            --accent-orange: #f97316;
            --border-color: #1e293b;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 0px;
            --navbar-height: 60px;
        }

        /* ==================== 全局重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* ==================== 主布局 ==================== */
        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ==================== 左侧边栏 ==================== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
            overflow: hidden;
            z-index: 200;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
            opacity: 0;
            border-right: none;
            pointer-events: none;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-height: var(--navbar-height);
        }

        .sidebar-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .sidebar-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .nav-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 12px 6px;
            white-space: nowrap;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
            white-space: nowrap;
            position: relative;
            user-select: none;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-left: 3px solid var(--accent-blue);
            padding-left: 9px;
        }

        .nav-item .nav-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-item .nav-label {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
        }

        .nav-item.active .nav-label {
            color: var(--text-primary);
            font-weight: 500;
        }

        .nav-item .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .nav-item .nav-dot.online {
            background: var(--accent-green);
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
        }

        .nav-item .nav-dot.offline {
            background: var(--accent-red);
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
        }

        .nav-item .nav-dot.checking {
            background: var(--accent-yellow);
            animation: pulse 1s infinite;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-footer .status-text {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ==================== 内容区 ==================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ==================== 顶部导航栏 ==================== */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            backdrop-filter: blur(12px);
            z-index: 100;
            min-height: var(--navbar-height);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
        }

        .btn-icon:hover {
            background: var(--bg-input);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .navbar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .navbar-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ==================== 工具状态指示灯 ==================== */
        .tool-status-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tool-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .tool-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: var(--transition);
        }

        .tool-indicator.online .dot {
            background: var(--accent-green);
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
        }

        .tool-indicator.offline .dot {
            background: var(--accent-red);
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
        }

        .tool-indicator.checking .dot {
            background: var(--accent-yellow);
            animation: pulse 1s infinite;
        }

        /* ==================== 聊天主体区域 ==================== */
        .page-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page-chat.hidden {
            display: none;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ==================== 工具页面（iframe容器） ==================== */
        .page-tool {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page-tool.hidden {
            display: none;
        }

        .tool-page-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .btn-back-chat {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-back-chat:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .tool-page-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-page-url {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .tool-iframe-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tool-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-primary);
        }

        .iframe-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            gap: 12px;
            z-index: 1;
        }

        .iframe-loading.hidden {
            display: none;
        }

        .iframe-loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .iframe-loading .loading-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ==================== 欢迎界面 ==================== */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            min-height: 60vh;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 400px;
            line-height: 1.6;
        }

        /* ==================== 快捷按钮区域 ==================== */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            max-width: 600px;
            width: 100%;
        }

        .quick-btn {
            padding: 14px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            text-align: center;
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .quick-btn:nth-child(1) { animation-delay: 0.1s; }
        .quick-btn:nth-child(2) { animation-delay: 0.2s; }
        .quick-btn:nth-child(3) { animation-delay: 0.3s; }
        .quick-btn:nth-child(4) { animation-delay: 0.4s; }
        .quick-btn:nth-child(5) { animation-delay: 0.5s; }

        .quick-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .quick-btn .icon {
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .quick-btn:hover .icon {
            transform: scale(1.2) rotate(5deg);
        }

        .quick-btn .label {
            font-weight: 500;
        }

        .quick-btn .desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* ==================== 聊天气泡 ==================== */
        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
        }

        .message.error .message-avatar {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-orange));
        }

        .message-content {
            max-width: 70%;
            min-width: 60px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: var(--bg-user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background: var(--bg-bot-bubble);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message.error .bubble {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding: 0 4px;
        }

        .message.user .message-meta {
            justify-content: flex-end;
        }

        .meta-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .meta-tool {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* ==================== 图片消息 ==================== */
        .image-preview {
            margin-top: 8px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .image-preview img {
            width: 100%;
            max-width: 400px;
            display: block;
            cursor: pointer;
            transition: var(--transition);
        }

        .image-preview img:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .image-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .image-actions button {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .image-actions button:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* ==================== 图表容器 ==================== */
        .chart-container {
            margin-top: 8px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            max-width: 500px;
        }

        .chart-container canvas {
            max-height: 250px;
        }

        /* ==================== 加载动画 ==================== */
        .typing-indicator {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            animation: slideIn 0.3s ease-out;
        }

        .typing-indicator .message-avatar {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
        }

        .typing-bubble {
            background: var(--bg-bot-bubble);
            border-radius: var(--radius-sm);
            border-bottom-left-radius: 4px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        .typing-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 6px;
        }

        /* ==================== 底部输入区域 ==================== */
        .input-area {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .input-box {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: var(--bg-input);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            overflow: hidden;
        }

        .input-box:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 12px 16px;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            line-height: 1.5;
            font-family: inherit;
            outline: none;
        }

        .input-box textarea::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px;
        }

        .btn-send {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            background: var(--accent-blue);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .btn-send:hover:not(:disabled) {
            background: #2563eb;
            transform: scale(1.05);
        }

        .btn-send:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-stop {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--accent-red);
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .btn-stop:hover {
            background: var(--accent-red);
            color: white;
        }

        .btn-voice {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .btn-voice:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-voice.recording {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
            animation: pulse 1.5s infinite;
        }

        /* ==================== 语音识别状态 ==================== */
        .voice-status {
            display: none;
            text-align: center;
            padding: 6px 0;
            font-size: 12px;
            color: var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        .voice-status.active {
            display: block;
        }

        /* ==================== 查询步骤进度 ==================== */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }
        .step-item {
            color: var(--text-muted);
            transition: all 0.3s;
        }
        .step-item.active {
            color: var(--accent-blue);
            font-weight: 500;
        }
        .step-item.done {
            color: var(--accent-green);
        }

        /* ==================== 图片上传 ==================== */
        .btn-image-upload {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
            flex-shrink: 0;
            position: relative;
        }
        .btn-image-upload:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }
        .btn-image-upload.has-image {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.1);
        }
        .btn-image-upload input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* 图片预览区 */
        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .image-preview-bar.active {
            display: flex;
        }
        .image-preview-bar img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .image-preview-bar img:hover {
            border-color: var(--accent-purple);
        }
        .image-preview-bar .preview-info {
            flex: 1;
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .image-preview-bar .btn-remove-image {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .image-preview-bar .btn-remove-image:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* ==================== 快捷提示行 ==================== */
        .quick-tips {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .quick-tips::-webkit-scrollbar {
            height: 3px;
        }

        .quick-tips::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .tip-btn {
            flex-shrink: 0;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .tip-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.08);
        }

        /* ==================== 动画 ==================== */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== 图片灯箱 ==================== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ==================== 连接状态提示 ==================== */
        .connection-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .connection-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .connection-toast.error {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }

        .connection-toast.success {
            background: rgba(34, 197, 94, 0.9);
            color: white;
        }

        /* ==================== 表格样式 ==================== */
        .data-table {
            margin-top: 8px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            max-width: 500px;
            overflow-x: auto;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            background: var(--bg-card);
            color: var(--text-secondary);
            padding: 8px 12px;
            text-align: left;
            font-weight: 500;
            white-space: nowrap;
        }

        .data-table td {
            padding: 6px 12px;
            border-top: 1px solid var(--border-color);
            white-space: nowrap;
        }

        /* ==================== 多工具结果样式 ==================== */
        .multi-tool-section {
            margin-top: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.06);
            border-left: 3px solid var(--accent-blue);
        }

        .multi-tool-section .section-title {
            font-size: 12px;
            color: var(--accent-blue);
            font-weight: 600;
            margin-bottom: 4px;
        }

        /* ==================== 移动端工具状态栏 ==================== */
        .mobile-tool-status {
            display: none;
            gap: 4px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .mobile-tool-status .tool-indicator {
            font-size: 10px;
            padding: 2px 6px;
        }

        /* ==================== 响应式布局 ==================== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 500;
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            }

            .sidebar.collapsed {
                width: var(--sidebar-collapsed-width);
            }

            .navbar {
                padding: 10px 14px;
            }

            .navbar-title {
                font-size: 14px;
            }

            .tool-status-bar {
                display: none;
            }

            .mobile-tool-status {
                display: flex !important;
            }

            .chat-container {
                padding: 14px;
            }

            .message-content {
                max-width: 85%;
            }

            .quick-actions {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .quick-btn {
                padding: 10px 8px;
            }

            .quick-btn .desc {
                display: none;
            }

            .input-area {
                padding: 12px 14px;
            }

            .welcome-title {
                font-size: 20px;
            }

            .welcome-desc {
                font-size: 13px;
            }

            .tip-btn {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .message-content {
                max-width: 75%;
            }
        }
    </style>
</head>
<body>

        <!-- ==================== 主内容区 ==================== -->
        <div class="main-content">

    <script>
        // ==================== 全局变量 ====================
        const API_BASE = '';
        const sessionId = 'session_' + Date.now();
        let isSending = false;
        let recognition = null;
        let isRecording = false;
        let currentPage = 'chat';
        let uploadedImageData = null;  // 存储上传图片的base64数据
        let currentAbortController = null;

        // 工具定义
        const toolDefinitions = [
            { key: '记账',   name: '记账本',     icon: '💰', port: 5001 },
            { key: '日程',   name: '日程提醒',   icon: '⏰', port: 5002 },
            { key: '文生图', name: '文生图',     icon: '🎨', port: 5003 },
            { key: '基金',   name: '基金问答',   icon: '📈', port: 5000 },
            { key: '招股书', name: '招股书问答', icon: '📄', port: 5005 },
        ];

        const toolColorMap = {};
        toolDefinitions.forEach(t => { toolColorMap[t.key] = t.name; });

        const TOOL_COLORS = {
            '记账':     '#22c55e',
            '日程':     '#eab308',
            '文生图':   '#a855f7',
            '基金':     '#3b82f6',
            '招股书':   '#f97316',
            '多工具':   '#06b6d4',
            '闲聊':     '#64748b',
        };

        const TOOL_ICONS = {
            '记账':     '💰',
            '日程':     '⏰',
            '文生图':   '🎨',
            '基金':     '📈',
            '招股书':   '📄',
            '多工具':   '🔗',
            '闲聊':     '💬',
        };

        // ==================== 页面切换 ====================
        function switchPage(page) {
            currentPage = page;

            const chatPage = document.getElementById('pageChat');
            const toolPage = document.getElementById('pageTool');

            // 更新侧边栏 active 状态
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const navEl = document.getElementById('nav-' + page);
            if (navEl) navEl.classList.add('active');

            if (page === 'chat') {
                chatPage.classList.remove('hidden');
                toolPage.classList.add('hidden');
                document.getElementById('pageTitle').textContent = 'AI Agent 智能助手';
                document.getElementById('pageSubtitle').textContent = '五大工具智能编排 · 自然语言交互';
            } else {
                chatPage.classList.add('hidden');
                toolPage.classList.remove('hidden');

                const tool = toolDefinitions.find(t => t.key === page);
                if (tool) {
                    document.getElementById('pageTitle').textContent = tool.icon + ' ' + tool.name;
                    document.getElementById('pageSubtitle').textContent = '端口 ' + tool.port + ' · 直接操作工具';
                    document.getElementById('toolPageIcon').textContent = tool.icon;
                    document.getElementById('toolPageName').textContent = tool.name;
                    document.getElementById('toolPageUrl').textContent = 'localhost:' + tool.port;
                    loadToolIframe(tool);
                }
            }
        }

        function loadToolIframe(tool) {
            const iframe = document.getElementById('toolIframe');
            const loading = document.getElementById('iframeLoading');
            const url = 'http://localhost:' + tool.port;

            loading.classList.remove('hidden');

            // 仅在URL变化时才重新加载
            if (iframe.src !== url) {
                iframe.src = url;
            }

            iframe.onload = () => {
                loading.classList.add('hidden');
            };

            // 超时隐藏加载动画
            setTimeout(() => {
                loading.classList.add('hidden');
            }, 5000);
        }

        function refreshCurrentIframe() {
            const iframe = document.getElementById('toolIframe');
            const loading = document.getElementById('iframeLoading');
            loading.classList.remove('hidden');
            iframe.src = iframe.src; // reload
            setTimeout(() => loading.classList.add('hidden'), 3000);
        }

        function openIframeInNewTab() {
            const iframe = document.getElementById('toolIframe');
            if (iframe.src) {
                window.open(iframe.src, '_blank');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // ==================== 工具状态管理 ====================
        function initToolStatus() {
            const statusBar = document.getElementById('toolStatusBar');
            const mobileBar = document.getElementById('mobileToolStatus');

            toolDefinitions.forEach(tool => {
                const html = createToolIndicator(tool.key, tool.key);
                statusBar.insertAdjacentHTML('beforeend', html);
                mobileBar.insertAdjacentHTML('beforeend', html);
            });

            refreshToolStatus();
        }

        function createToolIndicator(key, name) {
            return `
                <div class="tool-indicator checking" id="indicator-${key}" title="${name}">
                    <span class="dot"></span>
                    <span>${name}</span>
                </div>
            `;
        }

        async function refreshToolStatus() {
            // 全部设为检查中
            toolDefinitions.forEach(tool => {
                const el = document.getElementById(`indicator-${tool.key}`);
                const dot = document.getElementById(`navdot-${tool.key}`);
                if (el) el.className = 'tool-indicator checking';
                if (dot) { dot.className = 'nav-dot'; dot.className = 'nav-dot checking'; }
            });

            document.getElementById('sidebarStatusText').textContent = '检查服务状态...';

            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                const services = data.data?.services || {};

                let onlineCount = 0;
                toolDefinitions.forEach(tool => {
                    const isOnline = services[tool.key] === true;
                    if (isOnline) onlineCount++;

                    // 更新顶部状态栏
                    const el = document.getElementById(`indicator-${tool.key}`);
                    if (el) {
                        el.className = `tool-indicator ${isOnline ? 'online' : 'offline'}`;
                        el.title = `${tool.key} - ${isOnline ? '在线' : '离线'}`;
                    }

                    // 更新侧边栏状态点
                    const dot = document.getElementById(`navdot-${tool.key}`);
                    if (dot) {
                        dot.className = `nav-dot ${isOnline ? 'online' : 'offline'}`;
                    }
                });

                document.getElementById('sidebarStatusText').textContent =
                    `${onlineCount}/${toolDefinitions.length} 服务在线`;
            } catch (err) {
                toolDefinitions.forEach(tool => {
                    const el = document.getElementById(`indicator-${tool.key}`);
                    const dot = document.getElementById(`navdot-${tool.key}`);
                    if (el) {
                        el.className = 'tool-indicator offline';
                        el.title = `${tool.key} - 服务不可达`;
                    }
                    if (dot) {
                        dot.className = 'nav-dot offline';
                    }
                });
                document.getElementById('sidebarStatusText').textContent = '服务不可达';
            }
        }

        setInterval(refreshToolStatus, 30000);

        // ==================== 图片上传 ====================
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showToast('请选择图片文件', 'error');
                return;
            }
            // 验证文件大小 (最大10MB)
            if (file.size > 10 * 1024 * 1024) {
                showToast('图片大小不能超过10MB', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageData = e.target.result; // base64 data URL
                // 显示预览
                const bar = document.getElementById('imagePreviewBar');
                const thumb = document.getElementById('imagePreviewThumb');
                const info = document.getElementById('imagePreviewInfo');
                thumb.src = uploadedImageData;
                info.textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + 'KB)';
                bar.classList.add('active');
                // 按钮高亮
                document.getElementById('imageUploadBtn').classList.add('has-image');
                showToast('图片已选择，发送时将调用文生图服务', 'success');
            };
            reader.readAsDataURL(file);
        }

        function removeUploadedImage() {
            uploadedImageData = null;
            document.getElementById('imagePreviewBar').classList.remove('active');
            document.getElementById('imageUploadBtn').classList.remove('has-image');
            document.getElementById('imageUploadInput').value = '';
        }

        function previewUploadedImage() {
            if (uploadedImageData) {
                openLightbox(uploadedImageData);
            }
        }

        function stopSending() {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('sendBtn').style.display = 'flex';
        }

        // ==================== 消息发送 ====================
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            const hasImage = uploadedImageData !== null;

            // 至少需要文字或图片
            if ((!message && !hasImage) || isSending) return;

            isSending = true;
            currentAbortController = new AbortController();
            document.getElementById('stopBtn').style.display = 'flex';
            document.getElementById('sendBtn').style.display = 'none';
            input.value = '';
            autoResize(input);

            hideWelcome();

            // 显示用户消息（含图片缩略图）
            let userDisplayMsg = message || '(图片)';
            const userImgSrc = hasImage ? uploadedImageData : null;
            removeUploadedImage();
            appendMessage('user', userDisplayMsg, null, userImgSrc);
            showTyping();

            try {
                // 如果有图片，直接调用文生图API（绕过LLM意图识别）
                if (hasImage) {
                    const prompt = message || '请根据图片生成效果图';
                    const displayImg = uploadedImageData;

                    // 清除上传状态
                    removeUploadedImage();
                    showTyping();

                    const response = await fetch('http://localhost:5003/api/v1/image/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: prompt,
                            type: 'right',
                            reference_image: displayImg,
                        }),
                        signal: currentAbortController.signal,
                    });

                    hideTyping();

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const result = await response.json();
                    if (result.code === 0 && result.data) {
                        const imgUrl = result.data.image_url || '';
                        const detail = result.data.detail || '';
                        if (imgUrl) {
                            // 通过代理加载图片并直接显示
                            showTyping();
                            try {
                                const proxyResp = await fetch(`${API_BASE}/api/proxy/image/fetch?url=${encodeURIComponent(imgUrl)}`, {
                                    signal: currentAbortController.signal
                                });
                                const proxyData = await proxyResp.json();
                                hideTyping();
                                if (proxyData.code === 0 && proxyData.data && proxyData.data.data_url) {
                                    appendImageMessage('bot', detail || '图片生成成功', proxyData.data.data_url, '文生图');
                                } else {
                                    appendImageMessage('bot', detail || '图片生成成功，但代理加载失败', imgUrl, '文生图');
                                }
                            } catch(e) {
                                hideTyping();
                                appendImageMessage('bot', detail || '图片生成成功', imgUrl, '文生图');
                            }
                        } else {
                            appendMessage('bot', detail || '图片生成完成，但未返回图片URL');
                        }
                    } else {
                        appendMessage('error', '文生图失败：' + (result.message || '未知错误'));
                    }
                } else {
                    // 纯文字消息
                    const isText2Img = /生成.*图|画.*图|画.*张|文生图|AI画|帮我画|生成一张|画一个|创建.*图/.test(message);
                    const isFundQuery = /基金|净值|收益率|股票|持仓/.test(message);
                    const isProspectusQuery = /招股书|IPO|上市|招股/.test(message);

                    // 文字生图：直接调用豆包API
                    if (isText2Img) {
                        showTyping();
                        try {
                            const imgResp = await fetch(`${API_BASE}/api/text2img`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ prompt: message }),
                                signal: currentAbortController.signal,
                            });
                            hideTyping();
                            if (!imgResp.ok) throw new Error(`HTTP ${imgResp.status}`);
                            const imgResult = await imgResp.json();
                            if (imgResult.code === 0 && imgResult.data && imgResult.data.image_url) {
                                appendImageMessage('bot', `文字生图完成！\n提示词：${message}`, imgResult.data.image_url, '文生图');
                            } else {
                                appendMessage('error', '文字生图失败：' + (imgResult.message || '未知错误'));
                            }
                        } catch (err) {
                            hideTyping();
                            if (err.name === 'AbortError') {
                                appendMessage('bot', '已停止生成');
                            } else {
                                appendMessage('error', `文字生图失败：${err.message}`);
                            }
                        }
                        isSending = false;
                        return;
                    }

                    if (isFundQuery || isProspectusQuery) {
                        hideTyping();
                        showStepProgress(['⏳ 生成SQL...', '⏳ 查询数据...', '⏳ 生成答案...']);
                    }
                    const response = await fetch(`${API_BASE}/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: message,
                            session_id: sessionId,
                        }),
                        signal: currentAbortController.signal,
                    });

                    hideTyping();
                    hideStepProgress();

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const result = await response.json();
                    const reply = result.reply || '抱歉，未能获取到回复';
                    const toolUsed = result.tool_used;
                    appendMessage('bot', reply, toolUsed);
                }
            } catch (err) {
                hideTyping();
                hideStepProgress();
                if (err.name === 'AbortError') {
                    appendMessage('bot', '已停止生成');
                } else {
                    appendMessage('error', `网络错误：${err.message}。请检查服务是否启动。`);
                    showToast('连接失败，请检查服务状态', 'error');
                }
            }

            isSending = false;
            currentAbortController = null;
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('sendBtn').style.display = 'flex';
        }

        function sendQuickMessage(msg) {
            // 确保在聊天页面
            if (currentPage !== 'chat') {
                switchPage('chat');
            }
            document.getElementById('userInput').value = msg;
            sendMessage();
        }

        // ==================== 消息渲染 ====================
        function appendMessage(role, text, toolUsed = null, imageSrc = null) {
            hideTyping();
            hideStepProgress();
            const list = document.getElementById('messageList');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            const avatarEmoji = role === 'user' ? '👤' : (role === 'error' ? '⚠️' : (role === 'reminder' ? '🔔' : '🤖'));
            const toolIcon = toolUsed ? (TOOL_ICONS[toolUsed] || '🔧') : '';
            const toolColor = toolUsed ? (TOOL_COLORS[toolUsed] || '#64748b') : '';

            let metaHtml = `<span class="meta-time">${time}</span>`;
            if (toolUsed && toolUsed !== '闲聊') {
                metaHtml += `<span class="meta-tool" style="background:${toolColor}15;color:${toolColor};border-color:${toolColor}40">${toolIcon} ${toolUsed}</span>`;
            }

            let extraHtml = '';
            if (imageSrc) {
                extraHtml = `<div class="image-preview"><img src="${imageSrc}" alt="用户图片" onclick="openLightbox(this.src)" loading="lazy" style="max-width:200px"></div>` + extraHtml;
            }
            const imageUrl = extractImageUrl(text);
            if (imageUrl) {
                extraHtml = `
                    <div class="image-preview">
                        <img src="${imageUrl}" alt="生成的图片" onclick="openLightbox(this.src)" loading="lazy">
                    </div>
                    <div class="image-actions">
                        <button onclick="openLightbox('${imageUrl}')">🔍 查看大图</button>
                        <button onclick="downloadImage('${imageUrl}')">⬇ 下载</button>
                    </div>
                `;
            }

            if (Array.isArray(text)) {
                extraHtml = renderDataTable(text);
                text = '';
            }

            // 如果提取到了图片URL，从气泡文本中去掉，避免显示一长串链接
            if (imageUrl && text) {
                text = text.replace(imageUrl, '').replace(/\n{2,}/g, '\n').trim();
            }

            const messageHtml = `
                <div class="message ${role}">
                    <div class="message-avatar">${avatarEmoji}</div>
                    <div class="message-content">
                        <div class="bubble">${escapeHtml(text)}</div>
                        ${extraHtml}
                        <div class="message-meta">${metaHtml}</div>
                    </div>
                </div>
            `;

            list.insertAdjacentHTML('beforeend', messageHtml);
            scrollToBottom();
        }

        // 图片消息：显示文字+大图，不显示URL文本
        function appendImageMessage(role, text, imageUrl, toolUsed = null) {
            hideTyping();
            hideStepProgress();
            const list = document.getElementById('messageList');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const toolIcon = toolUsed ? (TOOL_ICONS[toolUsed] || '🔧') : '';
            const toolColor = toolUsed ? (TOOL_COLORS[toolUsed] || '#64748b') : '';

            let metaHtml = `<span class="meta-time">${time}</span>`;
            if (toolUsed && toolUsed !== '闲聊') {
                metaHtml += `<span class="meta-tool" style="background:${toolColor}15;color:${toolColor};border-color:${toolColor}40">${toolIcon} ${toolUsed}</span>`;
            }

            const messageHtml = `
                <div class="message ${role}">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="bubble">${escapeHtml(text)}</div>
                        <div class="image-preview">
                            <img src="${imageUrl}" alt="生成的图片" onclick="openLightbox(this.src)" loading="lazy">
                        </div>
                        <div class="image-actions">
                            <button onclick="openLightbox('${imageUrl}')">🔍 查看大图</button>
                            <button onclick="downloadImage('${imageUrl}')">⬇ 下载</button>
                        </div>
                        <div class="message-meta">${metaHtml}</div>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', messageHtml);
            scrollToBottom();
        }

        function extractImageUrl(text) {
            if (!text || typeof text !== 'string') return null;
            const urlRegex = /(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp|bmp))/i;
            const match = text.match(urlRegex);
            return match ? match[1] : null;
        }

        function renderDataTable(records) {
            if (!records.length) return '';
            const keys = Object.keys(records[0]);
            let html = '<div class="data-table"><table><thead><tr>';
            keys.forEach(k => { html += `<th>${escapeHtml(k)}</th>`; });
            html += '</tr></thead><tbody>';
            records.forEach(record => {
                html += '<tr>';
                keys.forEach(k => { html += `<td>${escapeHtml(String(record[k] || ''))}</td>`; });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }

        function renderChart(canvasId, chartConfig) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            new Chart(canvas.getContext('2d'), chartConfig);
        }

        // ==================== 加载动画 ====================
        function showTyping() {
            const list = document.getElementById('messageList');
            const html = `
                <div class="typing-indicator" id="typingIndicator">
                    <div class="message-avatar">🤖</div>
                    <div class="typing-bubble">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <span class="typing-text">思考中…</span>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ==================== 查询步骤进度 ====================
        function showStepProgress(steps) {
            const list = document.getElementById('messageList');
            const html = `
                <div class="typing-indicator" id="stepProgress">
                    <div class="message-avatar">🤖</div>
                    <div class="typing-bubble">
                        <div class="step-list">
                            ${steps.map((s, i) => `<span class="step-item ${i === 0 ? 'active' : ''}" id="step-${i}">${s}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function updateStepProgress(stepIndex) {
            for (let i = 0; i <= stepIndex; i++) {
                const el = document.getElementById('step-' + i);
                if (el) {
                    el.className = i < stepIndex ? 'step-item done' : 'step-item active';
                    el.textContent = (i < stepIndex ? '✅ ' : '⏳ ') + el.textContent.replace(/^[✅⏳] /, '');
                }
            }
            scrollToBottom();
        }

        function hideStepProgress() {
            const el = document.getElementById('stepProgress');
            if (el) el.remove();
        }

        // ==================== 语音输入 ====================
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('voiceBtn').title = '您的浏览器不支持语音输入';
                document.getElementById('voiceBtn').style.opacity = '0.3';
                document.getElementById('voiceBtn').style.cursor = 'not-allowed';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('userInput').value = transcript;
                autoResize(document.getElementById('userInput'));
            };

            recognition.onend = () => { stopRecording(); };

            recognition.onerror = (event) => {
                console.error('语音识别错误:', event.error);
                stopRecording();
                if (event.error === 'not-allowed') {
                    showToast('请允许麦克风权限', 'error');
                } else if (event.error !== 'aborted') {
                    showToast('语音识别失败，请重试', 'error');
                }
            };
        }

        function toggleVoice() {
            if (!recognition) {
                showToast('您的浏览器不支持语音输入', 'error');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                isRecording = true;
                const btn = document.getElementById('voiceBtn');
                const status = document.getElementById('voiceStatus');
                btn.classList.add('recording');
                status.classList.add('active');
                recognition.start();
            }
        }

        function stopRecording() {
            isRecording = false;
            const btn = document.getElementById('voiceBtn');
            const status = document.getElementById('voiceStatus');
            btn.classList.remove('recording');
            status.classList.remove('active');
        }

        // ==================== 图片功能 ====================
        function openLightbox(url) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = url;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = 'generated_image_' + Date.now() + '.png';
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // ==================== 对话管理 ====================
        async function clearChat() {
            if (!confirm('确定要清空所有对话记录吗？')) return;

            try {
                await fetch(`${API_BASE}/api/v1/history/clear`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId }),
                });
            } catch (e) {
                // 即使API调用失败也清空UI
            }

            document.getElementById('messageList').innerHTML = '';
            document.getElementById('welcomeScreen').style.display = 'flex';
            showToast('对话已清空', 'success');
        }

        function hideWelcome() {
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) {
                welcome.style.display = 'none';
            }
        }

        // ==================== 工具函数 ====================
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        }

        // ==================== 工具函数 ====================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `connection-toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            initToolStatus();
            initSpeechRecognition();
            initReminders();
        });

        // ==================== 日程提醒轮询 ====================
        let reminderPollTimer = null;
        function initReminders() {
            // 请求浏览器通知权限
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            // 每5秒轮询提醒
            reminderPollTimer = setInterval(pollReminders, 5000);
        }

        function pollReminders() {
            fetch('http://localhost:5002/reminders')
                .then(r => r.json())
                .then(data => {
                    if (data.reminders && data.reminders.length > 0) {
                        data.reminders.forEach(r => {
                            appendMessage('reminder', r.text);
                            sendBrowserNotify(r.text);
                        });
                    }
                })
                .catch(() => {});
        }

        function sendBrowserNotify(text) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('日程提醒', { body: text });
            }
        }

        function requestNotifPermission() {
            if (!('Notification' in window)) {
                showToast('浏览器不支持通知功能');
                return;
            }
            if (Notification.permission === 'granted') {
                showToast('通知已开启！');
                return;
            }
            if (Notification.permission === 'denied') {
                showToast('通知被禁止，请在浏览器设置中允许');
                return;
            }
            Notification.requestPermission().then(function(p) {
                if (p === 'granted') {
                    showToast('桌面通知已开启！');
                    new Notification('日程提醒', { body: '通知功能正常！到时间会自动提醒您。' });
                } else {
                    showToast('通知权限被拒绝');
                }
            });
        }
    </script>
